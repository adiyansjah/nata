[package]
name = "nata-pgwire"
description = "Bounded Postgres wire codec and simple and extended server"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sqlparser = { version = "0.63", default-features = false, features = ["std"] }
nata-sql = { path = "../nata-sql" }
nata-exec = { path = "../nata-exec" }
nata-parquet = { path = "../nata-parquet", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }

arrow-array = "60"

[target.'cfg(nata_portal_loom)'.dependencies]
loom = "=0.7.2"

[dev-dependencies]
parquet = "60"

[lints]
workspace = true
