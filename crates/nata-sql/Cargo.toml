[package]
name = "nata-sql"
description = "SQL front end of slice 4: parse (sqlparser behind our own AST), bind (exact types), logical plan with pushdown into the Parquet scan"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nata-parquet = { path = "../nata-parquet" }
nata-scan = { path = "../nata-scan" }
# `source::MemSource` builds the `Leaf` values of nata-parquet, which carry the Parquet physical type
parquet = "60"
# Rule R1 of card 0002 (decision 4b): reuse the crate WITHOUT its default `recursive-protection` feature (stacker and psm bring `unsafe` and assembly).
# The parse runs on a thread with a 16 MB stack behind a token-level guard instead (src/parse.rs).
sqlparser = { version = "0.63", default-features = false, features = ["std"] }

[dev-dependencies]
arrow-array = "60"
arrow-buffer = "60"
arrow-schema = "60"

[lints]
workspace = true
