[package]
name = "nata-exec"
description = "Execution of the logical plans of nata-sql (slice 4): strict expression evaluation on Arrow batches, filter, projection, limit, the scan with its pushed conjuncts, EXPLAIN ANALYZE"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
twox-hash = { version = "=2.1.5", default-features = false, features = ["xxhash3_64"] }
hashbrown = { version = "=0.17.1", default-features = false }
nata-sched = { path = "../nata-sched" }
nata-sql = { path = "../nata-sql" }
nata-parquet = { path = "../nata-parquet", default-features = false }
# `strict_cast` unpacks the scan's dictionary strings (the one sanctioned caller of arrow's cast)
nata-kernels = { path = "../nata-kernels" }
arrow-ipc = { version = "=60.1.0", default-features = false }
crc32fast = "=1.5.4"
flatbuffers = "=25.12.19"
libc = "=0.2.191"
arrow-array = "60"
arrow-buffer = "60"
arrow-schema = "60"
arrow-select = "60"

[dev-dependencies]
parquet = "60"

# The workspace lints, repeated (cargo does not allow `workspace = true` plus extra entries), and the ban of the lenient arrow entry points of
# ADR 0003 decision 6 (clippy.toml is a copy of nata-kernels'): every conversion goes through `nata_kernels::strict_cast` or our own checked code.
# `arithmetic_side_effects` is not enabled (index arithmetic is everywhere); value arithmetic is written with checked operations and tested.
[lints.rust]
# Only spill/admission.rs permits the two audited statvfs ABI operations.
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nata_loom)', 'cfg(nata_stats_disabled)'] }

[lints.clippy]
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
dbg_macro = "deny"
disallowed_methods = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
allow_attributes_without_reason = "deny"
