[package]
name = "nata"
description = "Nata node and CLI client"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clap.workspace = true
nata-parquet = { path = "../nata-parquet", default-features = false }
nata-sql = { path = "../nata-sql" }
nata-exec = { path = "../nata-exec" }
# SIGINT (Ctrl-C) cancels the running query: the one place that needs a signal handler, and the workspace forbids `unsafe` in our own code
signal-hook = "0.4"

# R4: page CRC verification is opt-in after the slice-4 ARM64 cost exceeded the 5% budget.
# Enable with `cargo build --release -p nata --features page-crc` (CLI) or `--features nata-parquet/page-crc` (reader).
# parquet-rs 60.1.0 has no runtime switch; see bench/results/20261106-slice4-bench.md.
[features]
default = []
page-crc = ["nata-parquet/page-crc"]

[dev-dependencies]
arrow-array = "60"
parquet = "60"

[lints]
workspace = true
