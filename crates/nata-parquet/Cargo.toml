[package]
name = "nata-parquet"
description = "Parquet scan of slice 3: footer statistics adapter, filter parser, exact row filter, row-group reader (single thread)"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Same arrow and parquet versions as the baseline spike of the slice (spikes/parquet-scan, deleted at the closeout; its results are in
# bench/results/20261105-parquet-scan-baseline.md).
[dependencies]
nata-scan = { path = "../nata-scan" }
nata-sched = { path = "../nata-sched" }
arrow-array = "60"
arrow-buffer = "60"
arrow-schema = "60"
arrow-select = "60"
bytes = "1"
parquet = "60"

# R4 (register item, slice 4): verify the CRC of a Parquet page when the page has one. parquet-rs 60.1.0 does this only when it is COMPILED with its `crc`
# feature (no run-time switch), so the choice is a cargo feature: on by default; `--no-default-features` builds the reader without it (the cost arm of the
# benchmark, and the known-bad build of the fuzz test).
[features]
default = ["page-crc"]
page-crc = ["parquet/crc"]

[lints]
workspace = true

# The tests write Parquet files with parquet-rs (several encodings, codecs and page versions) and compare with DuckDB and pyarrow.
[dev-dependencies]
