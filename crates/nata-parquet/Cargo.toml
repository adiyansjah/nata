[package]
name = "nata-parquet"
description = "Parquet scan of slice 3: footer statistics adapter, filter parser, exact row filter, row-group reader (single thread)"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Same arrow and parquet versions as the baseline spike of the slice (spikes/parquet-scan, deleted at the closeout; its results are in
# bench/results/20261105-parquet-scan-baseline.md).
[dependencies]
nata-scan = { path = "../nata-scan" }
nata-sched = { path = "../nata-sched" }
arrow-array = "60"
arrow-buffer = "60"
arrow-schema = "60"
arrow-select = "60"
bytes = "1"
parquet = "60"

# R4: page CRC verification is opt-in after the slice-4 ARM64 cost exceeded the 5% budget.
# Enable with `cargo build --release -p nata --features page-crc` (CLI) or `--features nata-parquet/page-crc` (reader).
# parquet-rs 60.1.0 has no runtime switch; see bench/results/20261106-slice4-bench.md.
[features]
default = []
page-crc = ["parquet/crc"]

[lints]
workspace = true

# The tests write Parquet files with parquet-rs (several encodings, codecs and page versions) and compare with DuckDB and pyarrow.
[dev-dependencies]
