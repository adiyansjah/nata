[package]
name = "nata-kernels"
description = "Checked, NULL-aware, selection-aware expression kernels (ADR 0003)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
arrow-arith = "60"
arrow-array = "60"
arrow-buffer = "60"
arrow-cast = "60"
arrow-schema = "60"
arrow-select = "60"

# Cargo does not allow `workspace = true` plus extra entries, so the workspace lints are repeated here
# and the strictness lints of ADR 0003 decision 6 are added. Keep the first block equal to [workspace.lints].
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
dbg_macro = "deny"
# ADR 0003 decision 6
disallowed_methods = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
allow_attributes_without_reason = "deny"
