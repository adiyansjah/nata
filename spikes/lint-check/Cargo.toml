# THROWAWAY SPIKE for ADR 0003, decision 6 (strictness lints). Not part of the main workspace.
[package]
name = "lint-check"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
arrow = "60"

[lints.clippy]
disallowed_methods = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"

[profile.release]
overflow-checks = true
