# THROWAWAY SPIKE for slice 4, rule R1 (card docs/slices/0002-select-where-limit.md, part 4): a bake-off of the `sqlparser` crate against a
# hand-written recursive-descent parser for exactly the slice's SQL subset. Not part of the main workspace. Result: bench/results/20261106-sql-parser-baseline.md
[package]
name = "spike-sql-parser"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[features]
default = ["arm-a", "stacker"]
# arm A: the sqlparser crate plus a conversion into the subset AST (switch off to size the build without it)
arm-a = ["dep:sqlparser"]
# sqlparser's default `recursive-protection` feature: grows the stack on demand with `stacker` (which brings psm, cc and unsafe code)
stacker = ["arm-a", "sqlparser/recursive-protection"]

[dependencies]
sqlparser = { version = "0.63", default-features = false, features = ["std"], optional = true }

[[bin]]
name = "bake"
path = "src/bin/bake.rs"
required-features = ["arm-a"]

[[bin]]
name = "parse_cli"
path = "src/bin/parse_cli.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
dbg_macro = "deny"

[profile.release]
overflow-checks = true
debug = false
