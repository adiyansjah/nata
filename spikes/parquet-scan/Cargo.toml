# THROWAWAY SPIKE: the baseline spike of the slice card docs/slices/0001-parquet-scan.md (decision rules R1 and R3).
#   R1: does parquet-rs (the Arrow reader, dictionaries kept, Decimal64) decode the projected columns of TPC-H lineitem at >= 0.8x of DuckDB's speed, one thread?
#   R3: morsel = a whole row group, or a quarter of one? 1 to 8 threads, with and without a Parquet page index.
# std threads only. Own workspace, not part of the main one. Delete once the slice is done; keep the results.
[package]
name = "spike-parquet-scan"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
arrow = "60"
parquet = "60"

[[bin]]
name = "pscan"
path = "src/main.rs"

[lib]
name = "pscan_lib"
path = "src/lib.rs"

[features]
# Deliberate bugs (mutants/run.sh); never enable them in a measurement.
bug-split-off-by-one = []   # the morsel ranges overlap by one row
bug-drop-last-thread = []   # the last thread's partial result is not merged
bug-dict-skips-last-key = [] # the dictionary fold ignores the last dictionary entry

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
# ADR 0003 decision 6: overflow checks on, like the engine's build
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn" }
