# THROWAWAY SPIKE (verification-plan item 24): is the Iceberg commit atomic and safe under concurrent writers, retries
# and crashes? Writers, fault injection and an invariant checker that replays every snapshot, run against a real
# Iceberg REST catalog (the Apache reference fixture, built by scripts/build-catalog.sh) and against conditional
# object-store creates. Own workspace. Delete once the table-format ADR is accepted.
[package]
name = "spike-iceberg-commit"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "iceberg_commit"
path = "src/lib.rs"

[[bin]]
name = "ic-spike"
path = "src/main.rs"

[dependencies]
# Plain HTTP only (the catalog runs on localhost): no TLS, no compression.
ureq = { version = "3", default-features = false }
serde_json = "1"
# The catalog-less mode: conditional create on a local file system (PutMode::Create). Default features = fs only.
object_store = { version = "0.14", default-features = false, features = ["fs"] }
futures = "0.3"
bytes = "1"
# The test double for the REST catalog (src/mock.rs), also used by `ic-spike mock`.
tiny_http = "0.12"

[features]
# The metadata versions in a real Google Cloud Storage bucket (NATA_STORE_URL=gs://BUCKET/PREFIX): conditional create is
# GCS's ifGenerationMatch=0. Off by default (pulls an HTTP and TLS stack).
gcs = ["object_store/gcp"]

[profile.release]
opt-level = 2
debug = "line-tables-only"
