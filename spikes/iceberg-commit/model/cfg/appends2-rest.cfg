\* Two concurrent appenders, REST catalog.
INIT Init
NEXT Next
CONSTANTS
    Writers = {1, 2}
    OpOf <- M2Op
    AppendRows <- M2App
    DelKey <- M2Del
    Rows = {1, 2, 3, 4}
    KeyOf <- MCKey
    InitRows = {1, 2}
    Style = "REST"
    Isolation = "serializable"
    MaxAttempts = 2
    MaxVer = 4
    MaxPins = 1
    CrashBudget = 1
    DupBudget = 1
    LossBudget = 1
INVARIANTS
    TypeOK
    I1_FilesExist
    I2_NoLostUpdate
    I3_ReaderSeesSnapshot
    I4_NoPhantom
    I5_AtMostOnce
    I6_SeqIncreases
    I7_NoSnapshotLost
