\* One appender: the cheapest check that the spec evaluates and holds.
INIT Init
NEXT Next
CONSTANTS
    Writers = {1}
    OpOf <- M1Op
    AppendRows <- M1App
    DelKey <- M1Del
    Rows = {1, 2, 3}
    KeyOf <- MCKey
    InitRows = {1, 2}
    Style = "REST"
    Isolation = "serializable"
    MaxAttempts = 2
    MaxVer = 3
    MaxPins = 1
    CrashBudget = 1
    DupBudget = 1
    LossBudget = 1
INVARIANTS
    TypeOK
    I1_FilesExist
    I2_NoLostUpdate
    I3_ReaderSeesSnapshot
    I4_NoPhantom
    I5_AtMostOnce
    I6_SeqIncreases
    I7_NoSnapshotLost
