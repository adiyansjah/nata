\* Snapshot isolation: every invariant except I4 must hold.
INIT Init
NEXT Next
CONSTANTS
    Writers = {1, 2, 3}
    OpOf <- M3Op
    AppendRows <- M3App
    DelKey <- M3Del
    Rows = {1, 2, 3}
    KeyOf <- MCKey
    InitRows = {1, 2}
    Style = "REST"
    Isolation = "snapshot"
    MaxAttempts = 2
    MaxVer = 5
    MaxPins = 1
    CrashBudget = 1
    DupBudget = 1
    LossBudget = 1
INVARIANTS
    TypeOK
    I1_FilesExist
    I2_NoLostUpdate
    I3_ReaderSeesSnapshot
    I5_AtMostOnce
    I6_SeqIncreases
    I7_NoSnapshotLost
