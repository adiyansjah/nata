\* EXPECTED TO FAIL: under snapshot isolation a delete-where may commit while a concurrently appended matching row survives (phantom). Shows that I4 can fail.
INIT Init
NEXT Next
CONSTANTS
    Writers = {1, 2, 3}
    OpOf <- M3Op
    AppendRows <- M3App
    DelKey <- M3Del
    Rows = {1, 2, 3}
    KeyOf <- MCKey
    InitRows = {1, 2}
    Style = "REST"
    Isolation = "snapshot"
    MaxAttempts = 2
    MaxVer = 5
    MaxPins = 1
    CrashBudget = 1
    DupBudget = 1
    LossBudget = 1
INVARIANTS
    I4_NoPhantom
