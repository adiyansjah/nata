\* Two delete-where(a) + compaction, serializable: the only configuration in which a delete can be REDUNDANT (the same
\* rows as another delete) and a compaction can meet it. Checks I8 besides the usual invariants. No crash, duplicate or
\* loss budget (the situation needs none); CommitStateUnknown is not budgeted and is explored.
INIT Init
NEXT Next
CONSTANTS
    Writers = {1, 2, 3}
    OpOf <- MddcOp
    AppendRows <- MddcApp
    DelKey <- MddcDel
    Rows = {1, 2}
    KeyOf <- MCKey
    InitRows = {1, 2}
    Style = "REST"
    Isolation = "serializable"
    MaxAttempts = 2
    MaxVer = 5
    MaxPins = 1
    CrashBudget = 0
    DupBudget = 0
    LossBudget = 0
INVARIANTS
    TypeOK
    I1_FilesExist
    I2_NoLostUpdate
    I3_ReaderSeesSnapshot
    I4_NoPhantom
    I5_AtMostOnce
    I6_SeqIncreases
    I7_NoSnapshotLost
    I8_CompactionSawNoDeleteFile
