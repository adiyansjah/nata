# THROWAWAY SPIKE for card 0006 part 4 (docs/slices/0006-object-store-io.md): the narrow baseline for ADR 0011 (request policy
# of a thin wrapper around object_store), ADR 0012 (bounded identity-validated metadata cache) and ADR 0002's open arm (split
# runtime against a separate tokio CPU runtime). Not part of the main workspace. `object_store` 0.14 is authorized for this
# spike only (card 0006 decision rule 1); it is NOT in the root lockfile. Delete once ADRs 0011/0012 are closed out; keep results.
[package]
name = "spike-object-store-baseline"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "fs", "macros"] }
# aws = S3 API (MinIO and the fake endpoint); gcp = the real GCS bucket; fs = the local-disk control.
object_store = { version = "0.14", default-features = false, features = ["aws", "gcp", "fs"] }
parquet = { version = "60" }
arrow = "60"
futures = "0.3"
bytes = "1"

[[bin]]
name = "osb"
path = "src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn" }

[profile.release]
opt-level = 3
debug = "line-tables-only"
# ADR 0003 decision 6: integer overflow is an error in release builds too.
overflow-checks = true
