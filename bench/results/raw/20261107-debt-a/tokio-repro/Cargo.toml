[package]
name = "tokio-tsan-repro"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
[profile.dev.package."*"]
opt-level = 2
overflow-checks = false
[[bin]]
name = "tokio-tsan-repro"
path = "main.rs"
