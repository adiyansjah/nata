# cargo-deny (verification-plan item 34, slice 4 card): licenses, banned or duplicated crates, sources and advisories of the workspace's
# dependency tree. Run: `cargo deny check` (CI and the eng-checks GCP job).
[graph]
all-features = false

[licenses]
# Permissive licenses compatible with Apache-2.0 distribution. A crate under any other license fails the check and is decided case by case.
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016",
         "Zlib", "CC0-1.0", "BSL-1.0", "0BSD", "MPL-2.0", "bzip2-1.0.6"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# path dependencies between the unpublished workspace crates carry no version; they are not wildcards from a registry
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# unmaintained crates are reported, a vulnerability fails the check
unmaintained = "workspace"
yanked = "deny"
