name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run, so minutes are not spent on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  leaks:
    # No GCP project id or number, billing account, key or personal address may land in the public repository
    # (scripts/check-leaks.sh; its own test plants each kind and must see it caught).
    name: leak check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-leaks.sh --tree
      - run: scripts/test-check-leaks.sh

  deps:
    # cargo-deny (licenses, bans, sources, advisories; deny.toml) and cargo-audit (RustSec), plan item 34
    name: dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: cargo audit
        run: cargo install --locked cargo-audit && cargo audit

  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # x86-64 and ARM64 are both first-class (docs/portability.md).
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Record the runner
        run: |
          uname -srm
          nproc
          lscpu | grep -E 'Model name|Architecture|^CPU\(s\)|L2|L3' || true
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Opt-in page checksum verification
        env:
          NATA_CRC_BUILD: "1"
        run: cargo test -p nata-parquet -p nata --features nata/page-crc --test checksums --test scan_cli --test sql_cli

  protocol:
    # The operator-protocol prototype (spikes/operator-trait): scheduler, wakers, exchange, spill,
    # and the deterministic shutdown-race test. ARM64's weaker memory ordering is the reason to
    # run it on both architectures. Correctness only; shared runners give no usable timings.
    name: operator protocol (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Record the runner
        run: |
          uname -srm
          nproc
          lscpu | grep -E 'Model name|Architecture|^CPU\(s\)' || true
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/operator-trait
      - name: Tests
        working-directory: spikes/operator-trait
        run: cargo test --release
      - name: Tests again, 5 more times (a hang or a race can be one run in a hundred)
        working-directory: spikes/operator-trait
        run: for i in 1 2 3 4 5; do cargo test --release || exit 1; done

  differential:
    # GATING since slice 4 (card 0002): `nata sql` against DuckDB 2.0.0 on both CPU types. What it runs, exactly:
    #   1. nata-check on check/queries/scan, sql, sql-differences, aggregate, smoke, decimal and decimal-differences (TPC-H SF 0.01 plus the edge-case files of
    #      scripts/gen-sql-check-data.sh). Every query must PASS. The queries that need SQL beyond slice 5 step B (ORDER BY, VALUES, SELECT without
    #      FROM) are listed in the PENDING file of their directory: each must still answer `not supported yet`, and one that starts to pass fails the run
    #      until it is removed from the list.
    #   2. the tests of the fuzzer of the subset (a planted failure is found and replays from its seed) and 20,000 random queries of the subset, seed
    #      20261106, against DuckDB through `nata sql` (spikes/sqlfuzz, `run-subset`): any difference that is not one of the listed classes fails.
    name: differential (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install DuckDB (the build for this CPU)
        run: |
          case "$(uname -m)" in
            x86_64) asset=duckdb-cli-linux-amd64.tar.gz ;;
            aarch64) asset=duckdb-cli-linux-arm64.tar.gz ;;
            *) echo "unsupported CPU $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/duckdb" && cd "$RUNNER_TEMP/duckdb"
          gh release download v2.0.0 --repo duckdb/duckdb -p "$asset"
          tar -xzf "$asset"
          echo "$PWD" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: duckdb --version
      - run: scripts/gen-tpch.sh 0.01 data/tpch-sf0.01
      - run: scripts/gen-sql-check-data.sh data/tpch-sf0.01
      - run: cargo build -p nata -p nata-check
      - run: cargo run -p nata-check -- --data data/tpch-sf0.01 --queries check/queries/scan
      - run: cargo run -p nata-check -- --data data/tpch-sf0.01 --queries check/queries/sql
      - run: cargo run -p nata-check -- --data data/tpch-sf0.01 --queries check/queries/aggregate
      - name: Check forced aggregate spill
        run: |
          mkdir -p "$RUNNER_TEMP/nata-spill"
          TMPDIR="$RUNNER_TEMP/nata-spill" cargo run -p nata-check -- --data data/tpch-sf0.01 --queries check/queries/aggregate --force-aggregate-spill
      - run: cargo run -p nata-check -- --data data/tpch-sf0.01 --queries check/queries/sql-differences
      - run: cargo run -p nata-check -- --data data/tpch-sf0.01 --queries check/queries/smoke
      - run: cargo run -p nata-check -- --data data/tpch-sf0.01 --queries check/queries/decimal
      - run: cargo run -p nata-check -- --data data/tpch-sf0.01 --queries check/queries/decimal-differences
      - name: SQL fuzzer, its own tests
        run: python3 -I spikes/sqlfuzz/tests/test_subset.py
      - name: SQL fuzzer, 20,000 queries of the subset against DuckDB through nata sql
        working-directory: spikes/sqlfuzz
        run: python3 -I fuzz.py run-subset --seed 20261106 --cases 20000 --jobs 2 --target-cmd "python3 -I adapters/nata_adapter.py" --out "$RUNNER_TEMP/fuzz-out"
