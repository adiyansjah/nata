[workspace]
resolver = "3"
members = ["crates/nata", "crates/nata-sql", "crates/nata-bench", "crates/nata-check", "crates/nata-kernels", "crates/nata-parquet", "crates/nata-sched", "crates/nata-scan"]
exclude = ["spikes"]

[workspace.package]
# not published to crates.io: lets cargo-deny accept the path dependencies between workspace crates (allow-wildcard-paths)
publish = false
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
# `nata_loom` selects the model-checked build of crates/nata-sched (see its src/sync.rs); it is not a feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nata_loom)'] }

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
dbg_macro = "deny"

# ADR 0003, decision 6: integer overflow is an error in release builds too (Cargo's default for release is off).
# Workspace-wide, not per package: a per-package entry only protects code that is compiled in that package, and
# rustc inlines small and generic kernel functions into the calling crate, where the CALLER's setting applies
# (shown by crates/nata-kernels/lint-fixtures/overflow_checks.py). Cost: see bench/results/20261104-kernel-lints-and-guards.md.
[profile.release]
overflow-checks = true

# ... but NOT for dependencies (ADR 0003 decision 6, the same setting as spikes/hash-ops): arrow computes on the slots under NULLs, whose contents are
# unspecified, with plain `+`; with checks on, concat of dictionary arrays panics on an `i32::MAX` key under a NULL slot (arrow-data 60.1.0
# src/transform/primitive.rs:46). The Parquet reader returns dictionary arrays, so this reaches the scan. crates/nata-parquet/tests/overflow_config.rs
# holds both facts as tests. `"*"` matches every package that is not a workspace member.
[profile.release.package."*"]
overflow-checks = false

[profile.test.package."*"]
overflow-checks = false
opt-level = 2

[profile.dev.package."*"]
overflow-checks = false
opt-level = 2

# The scan crate's own code is what the differential tests spend their time in (CSV rendering of 60,000-row batches); debug speed would make them take minutes.
[profile.test.package.nata-parquet]
opt-level = 2
